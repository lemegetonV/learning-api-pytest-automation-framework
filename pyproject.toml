[project]
name = "api-testing-python-pytest-framework"
version = "0.1.0"
description = "API test automation learning framework built module by module"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "smoke: quick health check tests",
    "regression: broader regression coverage",
    "crud: CRUD operation tests",
    "auth: authentication tests",
    "schema: schema validation tests",
    "performance: response-time checks",
    "security: introductory security checks",
    "reporting: report and log quality checks",
    "capstone: final DummyJSON capstone tests",
    "dummyjson: tests that target the DummyJSON API",
    "e2e: end-to-end workflow tests",
]
